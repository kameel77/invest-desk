name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Compile check (bez importu — wyłapie syntax bez CI sekretów)
        run: python -m compileall -q app tools tests

  secrets:
    # Gdyby ktoś kiedyś wsadził klucz do repo, lepiej żeby CI to zobaczyło
    # zanim zrobi to GitHub. Skan na typowe wzorce poza .venv i data/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against committed secrets
        run: |
          # Kolejność pathspec ma znaczenie — ostatni wygrywa, więc
          # wykluczenia muszą być na końcu. `*.py` samo w sobie obejmuje
          # tests/, a mocki w testach celowo zawierają ciągi przypominające
          # klucze, więc bez `':!tests/*'` guard blokowałby własny CI.
          if git grep -nEI "(api[_-]?key|secret[_-]?key|access[_-]?token)[[:space:]]*[:=][[:space:]]*[\"'][A-Za-z0-9_/+=-]{24,}[\"']" \
             -- 'app/*' 'tools/*' '*.py' ':!tests/*' ':!*.md'; then
            echo "::error::wykryto możliwy sekret w kodzie aplikacji"
            exit 1
          fi
          echo "brak sekretów w kodzie aplikacji"
