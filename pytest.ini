[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    # Ostrzeżenia z bibliotek trzecich nie mogą wywracać testów. Zmiana
    # wewnętrznej implementacji pandas nie oznacza, że logika domenowa
    # przestała działać — a `error::FutureWarning` wywróciłoby cały CI przy
    # aktualizacji zależności, z wywodem kodu, który jest poprawny.
    default
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::RuntimeWarning:pandas.*
